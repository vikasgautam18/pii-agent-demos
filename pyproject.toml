[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankingbuddy"
version = "0.1.0"
description = "BankingBuddy — Contoso Bank AI Assistant with PII Shield protection"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "agent-framework-foundry>=1.0.0",
    "azure-identity>=1.15.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
library = [
    "pii-shield>=0.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["bankingbuddy*"]
